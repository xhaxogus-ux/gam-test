<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근길 감 테스트 — B 석간 타블로이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* B. 석간 타블로이드 — 검은 제호 띠, 굵은 고딕, 톱기사 + 2단 */
:root {
  --paper: #f2f0eb;
  --ink: #111111;
  --sub: #5c5a55;
  --block: #e6e2d8;
  --hi: #ffd84d;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--paper); color: var(--ink); min-height: 100dvh; }
body {
  font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  word-break: keep-all; letter-spacing: -0.02em; line-height: 1.5;
}
.page {
  max-width: 430px; min-height: 100dvh; margin: 0 auto;
  padding: 0 0 calc(24px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column;
}

/* 제호 띠 */
.mast { background: var(--ink); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 20px 20px; }
.mast .edition {
  display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,.7); margin-bottom: 10px;
}
h1 { font-size: 52px; font-weight: 900; line-height: 1.02; letter-spacing: -0.05em; }
h1 mark { background: linear-gradient(transparent 58%, var(--hi) 58%); color: inherit; padding: 0 2px; }
.mast h1 mark { background: linear-gradient(transparent 62%, rgba(255,216,77,.85) 62%); color: #fff; }
.deck { font-size: 17px; font-weight: 600; margin-top: 12px; }

/* 속보 줄 */
.ticker {
  display: flex; align-items: center; gap: 10px;
  background: var(--hi); padding: 9px 20px; font-size: 13px; font-weight: 700;
}
.ticker b { background: var(--ink); color: var(--hi); padding: 1px 7px; font-size: 12px; }

/* 기사 */
.body { padding: 18px 20px 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--sub); }
.topic {
  width: 100%; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--block); padding: 16px; display: flex; flex-direction: column; gap: 4px;
}
.topic:active { filter: brightness(.96); }
.topic:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.emoji { font-size: 28px; line-height: 1.1; }
.title { font-size: 17px; font-weight: 800; line-height: 1.3; }
.blurb { font-size: 13px; color: var(--sub); line-height: 1.45; }

.top { background: var(--ink); color: #fff; padding: 20px 18px; flex-direction: row; align-items: center; gap: 16px; }
.top .emoji { font-size: 44px; }
.top .title { font-size: 23px; }
.top .blurb { color: rgba(255,255,255,.72); font-size: 14px; }
.top .tag { font-size: 11px; font-weight: 800; color: var(--hi); letter-spacing: .1em; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
/* 카드가 길어져도 이모지는 위, 글은 아래로 붙여 가운데가 비지 않게 */
.grid .title { margin-top: auto; }

.foot { font-size: 12px; color: var(--sub); padding: 14px 20px 0; text-align: center; }
</style>
</head>
<body>
<main class="page">
  <header class="mast">
    <div class="edition"><span>석간 · 10월 28일</span><span>5개 주제</span></div>
    <h1>출근길<br><mark>감</mark> 테스트</h1>
    <p class="deck">출근길 숫자, 당신의 감은 몇 점?</p>
  </header>
  <div class="ticker"><b>속보</b>주제당 5문항 · 1분이면 끝납니다</div>

  <section class="body">
    <p class="label">오늘의 톱</p>
    <button class="topic top">
      <span class="emoji">🚇</span>
      <span>
        <span class="tag">톱기사</span><br>
        <span class="title">지하철은 몇 분이나</span><br>
        <span class="blurb">아침 8시, 노선별 출근 시간</span>
      </span>
    </button>
    <div class="grid">
      <button class="topic"><span class="emoji">☕</span><span class="title">아메리카노 한 잔</span><span class="blurb">커피값은 10년 사이 얼마나 올랐나</span></button>
      <button class="topic"><span class="emoji">🌧️</span><span class="title">출근길 날씨</span><span class="blurb">아침에 우산을 챙겨야 했던 날</span></button>
      <button class="topic"><span class="emoji">🚌</span><span class="title">버스냐 지하철이냐</span><span class="blurb">수단별 평균 통근 시간</span></button>
      <button class="topic"><span class="emoji">📱</span><span class="title">손에서 못 놓는 폰</span><span class="blurb">하루 스마트폰 사용 시간</span></button>
    </div>
  </section>

  <p class="foot">모든 숫자는 공개 데이터에서 직접 계산했습니다</p>
</main>
</body>
</html>
