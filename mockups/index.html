<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 화면 시안 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 세 시안을 폰 크기(390×844)로 나란히 본다. 좁은 화면에서는 아래로 쌓인다. */
* { box-sizing: border-box; margin: 0; }
body {
  font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif;
  background: #d9d6cf; color: #222; padding: 24px 16px;
}
h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
figure { display: flex; flex-direction: column; align-items: center; gap: 10px; }
figcaption { font-size: 14px; font-weight: 700; }
figcaption a { color: #555; font-weight: 400; margin-left: 6px; }
iframe {
  width: 390px; max-width: calc(100vw - 32px); height: 844px; border: 0;
  border-radius: 28px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
</style>
</head>
<body>
<h1>출근길 감 테스트 — 첫 화면 시안 3종</h1>
<div class="row">
  <figure><iframe src="a-morning.html" title="A 조간 1면"></iframe><figcaption>A. 조간 1면 <a href="a-morning.html">따로 열기</a></figcaption></figure>
  <figure><iframe src="b-tabloid.html" title="B 석간 타블로이드"></iframe><figcaption>B. 석간 타블로이드 <a href="b-tabloid.html">따로 열기</a></figcaption></figure>
  <figure><iframe src="c-weekend.html" title="C 주말판 퍼즐면"></iframe><figcaption>C. 주말판 퍼즐면 <a href="c-weekend.html">따로 열기</a></figcaption></figure>
</div>
</body>
</html>
