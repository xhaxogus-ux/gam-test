<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출근길 감 테스트 — C 주말판 퍼즐면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* C. 주말판 퍼즐면 — 따뜻한 종이, 오려 붙인 듯한 흰 카드, 큰 문제 번호 */
:root {
  --paper: #ebe4d6;
  --card: #fbf9f4;
  --ink: #23201b;
  --sub: #716a5e;
  --rule: #c9bfac;
  --blue: #2f5d8a;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--paper); color: var(--ink); min-height: 100dvh; }
body {
  font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  word-break: keep-all; letter-spacing: -0.01em; line-height: 1.5;
}
.page {
  max-width: 430px; min-height: 100dvh; margin: 0 auto;
  padding: 26px 18px calc(24px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column;
}

/* 제호 */
.mast { text-align: center; }
.section {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .3em;
  color: var(--blue); padding-left: .3em;
}
h1 {
  font-family: "Noto Serif KR", "Nanum Myeongjo", serif; font-weight: 900;
  font-size: 40px; line-height: 1.2; letter-spacing: -0.04em; margin: 8px 0 10px;
}
.deck { font-size: 16px; color: var(--sub); }
.deck b { color: var(--ink); }
.meta {
  display: flex; justify-content: center; gap: 14px; margin: 16px 0 18px;
  font-size: 12px; color: var(--sub);
}
.meta span + span::before { content: "·"; margin-right: 14px; }

/* 문제 카드 */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; align-content: stretch; }
.topic {
  border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--card); padding: 14px 14px 16px; border-radius: 4px;
  box-shadow: 0 4px 20px rgba(60,45,20,.08);
  display: flex; flex-direction: column; gap: 4px; position: relative;
}
.topic:active { transform: translateY(1px); }
.topic:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.topic .q {
  font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 13px; color: var(--blue);
  letter-spacing: .05em;
}
.topic .emoji { position: absolute; top: 12px; right: 12px; font-size: 26px; line-height: 1; }
/* margin-top: auto — 카드가 길어지면 제목·설명이 아래로 붙는다 */
.topic .title { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 17px; line-height: 1.3; margin-top: auto; padding-top: 18px; }
.topic .blurb { font-size: 12.5px; color: var(--sub); line-height: 1.45; }
.topic.wide { grid-column: span 2; flex-direction: row; align-items: center; gap: 14px; }
.topic.wide .emoji { position: static; font-size: 34px; }
.topic.wide .title { margin-top: 2px; }

.foot {
  font-size: 12px; color: var(--sub); text-align: center;
  border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 16px;
}
</style>
</head>
<body>
<main class="page">
  <header class="mast">
    <span class="section">주말판 · 숫자 퍼즐</span>
    <h1>출근길 감 테스트</h1>
    <p class="deck">출근길 숫자, 당신의 감은 <b>몇 점?</b></p>
    <div class="meta"><span>5개 주제</span><span>주제당 5문항</span><span>1분</span></div>
  </header>

  <section class="grid">
    <button class="topic wide"><span class="emoji">🚇</span><span><span class="q">문제 01</span><br><span class="title">지하철은 몇 분이나</span><br><span class="blurb">아침 8시, 노선별 출근 시간</span></span></button>
    <button class="topic"><span class="q">문제 02</span><span class="emoji">☕</span><span class="title">아메리카노 한 잔</span><span class="blurb">커피값은 10년 사이 얼마나 올랐나</span></button>
    <button class="topic"><span class="q">문제 03</span><span class="emoji">🌧️</span><span class="title">출근길 날씨</span><span class="blurb">아침에 우산을 챙겨야 했던 날</span></button>
    <button class="topic"><span class="q">문제 04</span><span class="emoji">🚌</span><span class="title">버스냐 지하철이냐</span><span class="blurb">수단별 평균 통근 시간</span></button>
    <button class="topic"><span class="q">문제 05</span><span class="emoji">📱</span><span class="title">손에서 못 놓는 폰</span><span class="blurb">하루 스마트폰 사용 시간</span></button>
  </section>

  <p class="foot">모든 숫자는 공개 데이터에서 직접 계산했습니다</p>
</main>
</body>
</html>
